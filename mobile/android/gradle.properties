# Tas Gradle dimensionne pour une machine de 8 Go (CDC : poste de dev reel).
# -Xmx8G + Metaspace 4G reclamaient plus que la RAM physique totale : le
# demon Gradle poussait le systeme en swap des le premier build lourd.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
