[project]
name = "tradepilot-bridge"
version = "1.0.0"
description = "Passerelle TradePilot : Telegram, analyse de signaux, gestion du risque et execution MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "telethon>=1.36",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
tunnel = ["pyngrok>=7.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
]

[project.scripts]
tradepilot-bridge = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # Depends() en valeur par defaut : idiome FastAPI
    "E712",   # comparaisons SQLAlchemy == False
    "RUF001", # caracteres unicode dans les chaines francaises
    "RUF002",
    "RUF003",
    "SIM108", # ternaires imposes moins lisibles ici
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
exclude = "(^|/)(tests|\\.venv)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-q"
